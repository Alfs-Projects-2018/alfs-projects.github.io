<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; script-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Alf's Projects</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1.25rem; line-height: 1.6; color: #1f2328; }
    h1 { margin-bottom: .25rem; }
    .card { border: 1px solid #d0d7de; border-radius: 12px; padding: 1.25rem; margin-top: 1.5rem; }
    .card a.button { display: inline-block; margin-top: .75rem; padding: .5rem 1rem; border-radius: 8px; background: #1f6feb; color: #fff; text-decoration: none; }
    footer { margin-top: 3rem; font-size: .875rem; color: #59636e; }
  </style>
</head>
<body>
  <h1>Alf's Projects</h1>
  <p>Things I've built. Free to use, nothing to sign up for.</p>

  <div class="card">
    <h2>Career Selector</h2>
    <p>A quick, game-style quiz that suggests careers to explore. Nothing is saved: refresh to start again.</p>
    <a class="button" href="https://career-selector.pages.dev" rel="noopener noreferrer">Open the app</a>
  </div>

  <footer>This site uses no cookies, analytics or tracking.</footer>
</body>
</html>
